<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Chat n8n + Gemini</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; height: 90vh; padding: 20px; }
        #chat-box { flex-grow: 1; border: 1px solid #ccc; overflow-y: auto; padding: 10px; margin-bottom: 10px; border-radius: 8px; }
        .user { color: blue; margin-bottom: 5px; }
        .bot { color: green; margin-bottom: 15px; font-weight: bold; }
        .input-area { display: flex; gap: 10px; }
        input { flex-grow: 1; padding: 10px; }
        button { padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Assistente Gemini</h2>
    <div id="chat-box"></div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Digite sua mensagem...">
        <button onclick="sendMessage()">Enviar</button>
    </div>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const message = inputField.value;
            if (!message) return;

            // 1. Mostrar mensagem do usuário na tela
            chatBox.innerHTML += `<div class="user">Você: ${message}</div>`;
            inputField.value = '';

            try {
                // 2. Enviar para o seu Webhook do n8n
                const response = await fetch('https://n8n.resod.dev/webhook/f63d973e-4c56-48c5-8191-e2c239602ef2', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chatInput: message })
                });

                const data = await response.json();
                
                // 3. Exibir a resposta (ajuste 'output' para o nome da variável que o n8n retorna)
                const botReply = data.output || data.text || JSON.stringify(data);
                chatBox.innerHTML += `<div class="bot">Gemini: ${botReply}</div>`;
                
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                chatBox.innerHTML += `<div class="bot" style="color:red">Erro: Não foi possível conectar ao n8n.</div>`;
            }
        }
    </script>
</body>
</html>
